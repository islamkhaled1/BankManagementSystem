name: C++ Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      
    - name: Build
      run: |
        cl /EHsc FileName.cpp /Fe:BankSystem.exe
        
    - name: Test
      run: |
        echo "Build successful!"
